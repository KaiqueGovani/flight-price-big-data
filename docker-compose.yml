# Big Data environment for flight price prediction
# Usage: docker compose up -d
# UIs: NameNode http://localhost:9870 | Spark http://localhost:8080 | Jupyter http://localhost:8888 (token: bigdata2026)

services:
  # --- HDFS NameNode: manages filesystem metadata ---
  namenode:
    image: apache/hadoop:3.5.0
    hostname: namenode
    container_name: namenode
    user: "0"
    command: >
      bash -lc "
      mkdir -p /tmp/hadoop-hadoop/dfs/name &&
      if [ ! -d /tmp/hadoop-hadoop/dfs/name/current ]; then
        hdfs namenode -format -force -nonInteractive;
      fi &&
      exec hdfs namenode
      "
    ports:
      - "9870:9870"   # Web UI
      - "9000:9000"   # HDFS RPC
    environment:
      HADOOP_HOME: /opt/hadoop
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.namenode.name.dir: file:///tmp/hadoop-hadoop/dfs/name
      HDFS-SITE.XML_dfs.replication: "1"
    volumes:
      - namenode-data:/tmp/hadoop-hadoop/dfs/name
      - ./scripts:/scripts
      - ./data:/data
    networks:
      - bigdata-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get 2>/dev/null | grep -q OFF"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- HDFS DataNode: stores actual data blocks ---
  datanode:
    image: apache/hadoop:3.5.0
    hostname: datanode
    container_name: datanode
    user: "0"
    command: >
      bash -lc "
      mkdir -p /tmp/hadoop-hadoop/dfs/data &&
      exec hdfs datanode
      "
    environment:
      HADOOP_HOME: /opt/hadoop
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.datanode.data.dir: file:///tmp/hadoop-hadoop/dfs/data
      HDFS-SITE.XML_dfs.replication: "1"
    volumes:
      - datanode-data:/tmp/hadoop-hadoop/dfs/data
    networks:
      - bigdata-net
    restart: unless-stopped
    depends_on:
      namenode:
        condition: service_healthy

  # --- Spark Master: cluster manager ---
  spark-master:
    image: spark:3.5.3-scala2.12-java17-python3-ubuntu
    hostname: spark-master
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Web UI
      - "7077:7077"   # Cluster RPC
    environment:
      PYSPARK_PYTHON: python3
    volumes:
      - ./scripts:/scripts
      - ./data:/data:ro
    networks:
      - bigdata-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # --- Spark Worker: executes tasks ---
  spark-worker:
    image: spark:3.5.3-scala2.12-java17-python3-ubuntu
    hostname: spark-worker
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"   # Web UI
    environment:
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: "2"
      PYSPARK_PYTHON: python3
    volumes:
      - ./scripts:/scripts
      - ./data:/data:ro
    networks:
      - bigdata-net
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy

  # --- Jupyter: notebook IDE with PySpark support ---
  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    image: flight-price-jupyter:local
    hostname: jupyter
    container_name: jupyter
    command: >
      bash -lc "
      python3 -m jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=$${JUPYTER_TOKEN}
      --ServerApp.root_dir=/work
      "
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: bigdata2026
      SPARK_MASTER: spark://spark-master:7077
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      SPARK_OPTS: >-
        --conf spark.driver.host=jupyter
        --conf spark.driver.memory=4g
        --conf spark.hadoop.fs.defaultFS=hdfs://namenode:9000
    volumes:
      - ./notebooks:/work
      - ./data:/data
    networks:
      - bigdata-net
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
      namenode:
        condition: service_healthy

volumes:
  namenode-data:
  datanode-data:

networks:
  bigdata-net:
    driver: bridge
